var params = new URLSearchParams(location.search);
var appKey = (params.get('app') || '').toLowerCase();
if (!APPS[appKey]) appKey = 'vpn';

function pickLang() {
  var q = (params.get('lang') || '').toLowerCase().split('-')[0];
  if (DOCS[q]) return q;
  var nav = (navigator.language || 'en').toLowerCase().split('-')[0];
  if (DOCS[nav]) return nav;
  return 'en';
}

function render(code) {
  var doc = DOCS[code] || DOCS.en;
  var app = APPS[appKey];

  document.documentElement.lang = code;
  document.documentElement.dir = doc.dir;
  document.title = app.name + ' - ' + doc.title.replace('&amp;', '&');
  document.getElementById('logo').src = app.logo;
  document.getElementById('logo').alt = app.name;
  document.getElementById('doc-title').innerHTML = doc.title;
  document.getElementById('last-updated').textContent = doc.updated;

  var body = doc.body.replace('{{TECH}}', doc.tech ? doc.tech[appKey] : '');
  document.getElementById('content').innerHTML = body.split('{{APP}}').join(app.name);
}

var select = document.getElementById('lang-select');
Object.keys(DOCS).forEach(function (code) {
  var o = document.createElement('option');
  o.value = code; o.textContent = DOCS[code].label;
  select.appendChild(o);
});

var current = pickLang();
select.value = current;
select.addEventListener('change', function () {
  current = select.value;
  params.set('lang', current);
  history.replaceState(null, '', location.pathname + '?' + params.toString());
  render(current);
});
render(current);
</script>
